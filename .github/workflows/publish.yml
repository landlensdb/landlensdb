name: Publish Python Package and Docker Image

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Verify tag matches package version
        shell: python
        run: |
          import os
          import tomllib

          with open("pyproject.toml", "rb") as pyproject_file:
              package_version = tomllib.load(pyproject_file)["project"]["version"]

          expected_tag = f"v{package_version}"
          actual_tag = os.environ["GITHUB_REF_NAME"]
          if actual_tag != expected_tag:
              raise SystemExit(
                  f"Release tag {actual_tag!r} does not match {expected_tag!r}"
              )

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          # Build package using pyproject.toml
          python -m build
          # Validate package metadata and long descriptions
          twine check dist/*
          # Upload to PyPI
          twine upload dist/* --skip-existing

  docker:
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            --tag "iosefa/landlensdb:${{ github.ref_name }}" \
            --tag iosefa/landlensdb:latest \
            .

      - name: Push Docker images
        run: |
          docker push "iosefa/landlensdb:${{ github.ref_name }}"
          docker push iosefa/landlensdb:latest
